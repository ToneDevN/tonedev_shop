services:
  # ─────────────────────────────────────────
  # Application (Laravel + Nginx + PHP-FPM)
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-portfolio:latest
    container_name: ecommerce_app
    restart: unless-stopped
    environment:
      APP_NAME: "E-Commerce Portfolio"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_KEY: ${APP_KEY}
      # Database
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      # Session / Cache / Queue
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      # Logging
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      # Persist SQLite database
      - db_data:/var/www/html/database
      # Persist uploaded files
      - storage_data:/var/www/html/storage/app
      # Persist logs
      - log_data:/var/www/html/storage/logs
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - ecommerce_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/up" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────
  # Queue Worker (artisan queue:work)
  # ─────────────────────────────────────────
  queue:
    image: ecommerce-portfolio:latest
    container_name: ecommerce_queue
    restart: unless-stopped
    command: [ "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600" ]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
    volumes:
      - db_data:/var/www/html/database
      - storage_data:/var/www/html/storage/app
      - log_data:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ecommerce_net

  # ─────────────────────────────────────────
  # Schedule Runner (artisan schedule:run)
  # ─────────────────────────────────────────
  scheduler:
    image: ecommerce-portfolio:latest
    container_name: ecommerce_scheduler
    restart: unless-stopped
    # runs every minute like a cron
    command: >
      sh -c "while true; do
        php artisan schedule:run >> /dev/null 2>&1;
        sleep 60;
      done"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - db_data:/var/www/html/database
      - log_data:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ecommerce_net

# ─────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────
volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
  log_data:
    driver: local

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  ecommerce_net:
    driver: bridge
