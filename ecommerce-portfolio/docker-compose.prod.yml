services:

  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: tonedev/ecommerce-portfolio:latest
    container_name: app
    restart: always
    env_file:
      - .env
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: prod
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/.env
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
  # PostgreSQL Standalone สำหรับ Laravel
  db:
    image: postgres:18-alpine
    container_name: laravel_db_standalone
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: always
    tty: true
    ports:
      - "8001:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/ssl/:/etc/nginx/ssl/
    networks:
      - app-network
    depends_on:
      - app

# Docker Networks
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  laravel_storage:
    driver: local
