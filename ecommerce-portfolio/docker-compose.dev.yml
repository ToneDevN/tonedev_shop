services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - INSTALL_DEV=true
    image: ecommerce-portfolio-dev:latest
    container_name: ecommerce_app_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:80"
    networks:
      - ecommerce_dev_net
    # Override standard entrypoint to run migrations automatically in dev
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisord.conf"]

  # Container to install PHP dependencies locally
  composer:
    image: composer:2.8
    container_name: ecommerce_composer_dev
    volumes:
      - .:/app
    command: install --ignore-platform-reqs

  # Container for frontend development
  node:
    image: node:20-alpine
    container_name: ecommerce_node_dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - ecommerce_dev_net

networks:
  ecommerce_dev_net:
    driver: bridge
